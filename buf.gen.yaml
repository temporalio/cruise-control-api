version: v2
plugins:
  - local: protoc-gen-go
    out: go
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: go
    opt: paths=source_relative
  - local: protoc-gen-openapiv2
    out: openapiv2
    opt:
      - output_format=yaml
      - allow_delete_body
      - disable_service_tags=true
