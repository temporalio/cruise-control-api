syntax = "proto3";
package temporal.api.cruisecontrol.extensions.computeplatformproviderservice.v1;

import "temporal/api/cruisecontrol/artifact/v1/artifact.proto";
import "temporal/api/cruisecontrol/extensions/computeplatformproviderservice/v1/types.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "go.temporal.io/api/cruise-control/extensions/computeplatformproviderservice/v1;computeplatformproviderservicev1";

// CreateDeployedVersionRequest asks a provider to create or verify one stable
// Cruise Control deployed-version identity.
message CreateDeployedVersionRequest {
  // Required: owning Pipeline full stable ID.
  string pipeline_id = 1;
  // Required: owning Target Group full stable ID.
  string target_group_id = 2;
  // Required: Deployment Target full stable ID.
  string target_id = 3;
  // Required: Cruise Control-generated idempotency identity.
  string deployed_version_id = 4;
  // Required: Full accepted artifact, including worker image references and Build ID.
  temporal.api.cruisecontrol.artifact.v1.Artifact artifact = 5;
  // Required: Temporal namespace used by the target.
  string temporal_namespace = 6;
  // Required: Temporal Worker Deployment name.
  string worker_deployment_name = 7;
  // Optional: Effective merged provider configuration, validated centrally.
  google.protobuf.Struct platform_details = 8;
  // Optional: snapshotted target environment variables.
  map<string, ProviderEnvironmentVariable> environment_variables = 9;
}

// CreateDeployedVersionResponse reports provider-owned identity and initial
// status for a create-or-verify request.
message CreateDeployedVersionResponse {
  // Optional: provider-owned version identifier.
  string provider_deployed_version_id = 1;
  // Required: latest provider status.
  ComputeProviderStatus status = 2;
  // Optional: bounded opaque provider details.
  google.protobuf.Struct provider_details = 3;
}

// DescribeDeployedVersionRequest identifies a previously created version.
message DescribeDeployedVersionRequest {
  // Required: owning Pipeline full stable ID.
  string pipeline_id = 1;
  // Required: owning Target Group full stable ID.
  string target_group_id = 2;
  // Required: Deployment Target full stable ID.
  string target_id = 3;
  // Required: Cruise Control deployed-version full stable ID.
  string deployed_version_id = 4;
  // Optional: provider-owned version identifier returned by create.
  string provider_deployed_version_id = 5;
  // Optional: Effective merged provider configuration, validated centrally.
  google.protobuf.Struct platform_details = 6;
}

// DescribeDeployedVersionResponse reports the latest provider observation.
message DescribeDeployedVersionResponse {
  // Required: latest provider status.
  ComputeProviderStatus status = 1;
  // Optional: bounded opaque provider details.
  google.protobuf.Struct provider_details = 2;
}

// DeleteDeployedVersionRequest asks the provider to idempotently remove a
// deployed version.
message DeleteDeployedVersionRequest {
  // Required: owning Pipeline full stable ID.
  string pipeline_id = 1;
  // Required: owning Target Group full stable ID.
  string target_group_id = 2;
  // Required: Deployment Target full stable ID.
  string target_id = 3;
  // Required: Cruise Control deployed-version full stable ID.
  string deployed_version_id = 4;
  // Optional: provider-owned version identifier returned by create.
  string provider_deployed_version_id = 5;
  // Optional: Effective merged provider configuration, validated centrally.
  google.protobuf.Struct platform_details = 6;
}

// DeleteDeployedVersionResponse reports completion of an idempotent delete.
message DeleteDeployedVersionResponse {}

// RunTaskRequest asks the provider to execute a target-scoped validation task.
message RunTaskRequest {
  // Required: owning Pipeline full stable ID.
  string pipeline_id = 1;
  // Required: owning Target Group full stable ID.
  string target_group_id = 2;
  // Required: Deployment Target full stable ID.
  string target_id = 3;
  // Required: stable Step Run identity used to make task execution idempotent.
  string task_id = 4;
  // Required: task container image.
  string task_image = 5;
  // Optional: command override.
  repeated string command = 6;
  // Optional: command arguments.
  repeated string args = 7;
  // Optional: merged target and step environment variables.
  map<string, ProviderEnvironmentVariable> environment_variables = 8;
  // Optional: Effective merged provider configuration, validated centrally.
  google.protobuf.Struct platform_details = 9;
}

// RunTaskResponse reports one terminal task execution.
message RunTaskResponse {
  // Required: process exit code; zero indicates success.
  int32 exit_code = 1;
  // Optional: bounded stdout summary.
  string stdout = 2;
  // Optional: bounded stderr summary.
  string stderr = 3;
  // Optional: provider-observed start time.
  google.protobuf.Timestamp started_at = 4;
  // Optional: provider-observed finish time.
  google.protobuf.Timestamp finished_at = 5;
  // Optional: bounded provider diagnostics.
  google.protobuf.Struct details = 6;
}

message ValidateConfigRequest {
  google.protobuf.Struct platform_details = 1;
}
message ValidateConfigResponse {}
