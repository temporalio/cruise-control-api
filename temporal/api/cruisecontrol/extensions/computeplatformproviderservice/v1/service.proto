syntax = "proto3";
package temporal.api.cruisecontrol.extensions.computeplatformproviderservice.v1;

import "temporal/api/cruisecontrol/extensions/computeplatformproviderservice/v1/request_response.proto";

option go_package = "go.temporal.io/api/cruise-control/extensions/computeplatformproviderservice/v1;computeplatformproviderservicev1";

// ComputePlatformProviderService supplies the provider-facing primitives used by
// built-in deployment steps. Operations must be idempotent under retries.
service ComputePlatformProviderService {
  // Validates provider configuration before publishing a compute pool revision.
  rpc ValidateConfig(ValidateConfigRequest) returns (ValidateConfigResponse);
  // Creates or verifies one deployed version.
  rpc CreateDeployedVersion(CreateDeployedVersionRequest) returns (CreateDeployedVersionResponse);
  // Describes provider health for one deployed version.
  rpc DescribeDeployedVersion(DescribeDeployedVersionRequest) returns (DescribeDeployedVersionResponse);
  // Deletes one deployed version idempotently.
  rpc DeleteDeployedVersion(DeleteDeployedVersionRequest) returns (DeleteDeployedVersionResponse);
  // Runs one target-scoped task.
  rpc RunTask(RunTaskRequest) returns (RunTaskResponse);
}
